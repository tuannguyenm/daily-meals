project_id = "daily-meals"

[auth]
site_url = "dailymeals://auth/callback"
additional_redirect_urls = ["dailymeals://auth/callback"]
enable_manual_linking = true
enable_signup = true
enable_anonymous_sign_ins = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[functions.recommendations]
verify_jwt = false
